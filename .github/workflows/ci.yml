name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: shell and Python syntax
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: bash -n
        run: |
          BASH_BIN=bash
          [[ "${{ runner.os }}" == "macOS" ]] && BASH_BIN=/opt/homebrew/bin/bash
          for f in install.sh tests/*.sh; do "$BASH_BIN" -n "$f"; done
      - name: Python compile
        run: python3 -m py_compile skills/ssot-doctor/assets/scripts/ssot-check.py tests/test-ssot-check.py

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -S warning -e SC2034 install.sh tests/*.sh

  checker:
    name: ssot-check regression tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run checker tests
        run: python3 tests/test-ssot-check.py

  mermaid-templates:
    name: parse template diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated parser dependencies
        run: npm install --prefix "$RUNNER_TEMP/ssot-mermaid" mermaid@11.12.0 jsdom@26.1.0 --no-audit --no-fund
      - name: Parse bilingual template diagrams
        run: node tests/test-mermaid-templates.mjs "$RUNNER_TEMP/ssot-mermaid/node_modules"

  bundle-shape:
    name: bundle shape, links, and budgets
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Run bundle shape tests
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            /opt/homebrew/bin/bash tests/test-bundle-shape.sh
          else
            bash tests/test-bundle-shape.sh
          fi

  installer-e2e:
    name: installer end-to-end
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Run installer e2e
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            /opt/homebrew/bin/bash tests/test-installer-e2e.sh
          else
            bash tests/test-installer-e2e.sh
          fi
